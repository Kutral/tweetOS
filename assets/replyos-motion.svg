<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ReplyOS animated draft preview</title>
  <desc id="desc">Animated preview of ReplyOS reading a tweet and generating grounded reply drafts.</desc>
  <style>
    :root {
      color-scheme: dark;
    }

    .bg {
      fill: #101214;
    }

    .panel {
      fill: #171b1d;
      stroke: rgba(223, 229, 224, 0.16);
      stroke-width: 1.5;
    }

    .soft {
      fill: #202628;
      stroke: rgba(223, 229, 224, 0.14);
      stroke-width: 1;
    }

    .title {
      font: 700 42px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #f5f7f4;
    }

    .copy {
      font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: rgba(245, 247, 244, 0.72);
    }

    .small {
      font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: rgba(245, 247, 244, 0.7);
    }

    .tweet {
      font: 600 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #f5f7f4;
    }

    .draft {
      font: 600 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #f5f7f4;
    }

    .muted {
      fill: rgba(245, 247, 244, 0.48);
    }

    .accent {
      fill: #43c47a;
    }

    .accent-stroke {
      stroke: #43c47a;
    }
  </style>

  <rect class="bg" width="960" height="360" rx="28"/>
  <path d="M0 294H960" stroke="#43c47a" stroke-width="1" opacity="0.08"/>
  <path d="M0 314H960" stroke="#f5f7f4" stroke-width="1" opacity="0.05"/>

  <text x="56" y="74" class="title">ReplyOS</text>
  <text x="56" y="108" class="copy">Grounded reply drafts that keep the tweet in the room.</text>

  <g transform="translate(56 142)">
    <rect class="panel" width="382" height="164" rx="14"/>
    <rect x="22" y="52" width="338" height="76" rx="10" fill="#43c47a" opacity="0.04">
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="54" width="8" height="72" rx="4" fill="#43c47a" opacity="0.9">
      <animate attributeName="x" values="26;352;26" keyTimes="0;0.55;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="24" y="42" class="small muted">Tweet</text>
    <text x="24" y="78" class="tweet">AI wrappers are not startups</text>
    <text x="24" y="106" class="tweet">unless distribution is the moat</text>
    <rect x="24" y="126" width="132" height="30" rx="15" fill="#243028" stroke="#43c47a" opacity="0.92"/>
    <text x="44" y="146" class="small">Draft reply</text>
  </g>

  <path class="accent-stroke" d="M458 224 C506 224 518 224 566 224" stroke-width="3" stroke-linecap="round" opacity="0.76" stroke-dasharray="14 12">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle class="accent" cx="512" cy="224" r="7">
    <animate attributeName="r" values="6;12;6" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(586 114)">
    <rect class="panel" width="318" height="202" rx="14"/>
    <text x="22" y="38" class="small muted">Reply drafts</text>

    <g opacity="0.45">
      <animate attributeName="opacity" values="0.45;1;1;0.45" keyTimes="0;0.18;0.82;1" begin="0s" dur="4.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 10" keyTimes="0;0.18;0.82;1" begin="0s" dur="4.8s" repeatCount="indefinite"/>
      <rect class="soft" x="20" y="52" width="278" height="30" rx="8"/>
      <text x="32" y="72" class="draft">nah, distribution is the real product</text>
    </g>

    <g opacity="0.45">
      <animate attributeName="opacity" values="0.45;1;1;0.45" keyTimes="0;0.18;0.82;1" begin="0.35s" dur="4.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 10" keyTimes="0;0.18;0.82;1" begin="0.35s" dur="4.8s" repeatCount="indefinite"/>
      <rect class="soft" x="20" y="88" width="278" height="30" rx="8"/>
      <text x="32" y="108" class="draft">wrappers die when CAC enters chat</text>
    </g>

    <g opacity="0.45">
      <animate attributeName="opacity" values="0.45;1;1;0.45" keyTimes="0;0.18;0.82;1" begin="0.7s" dur="4.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 10" keyTimes="0;0.18;0.82;1" begin="0.7s" dur="4.8s" repeatCount="indefinite"/>
      <rect class="soft" x="20" y="124" width="278" height="30" rx="8"/>
      <text x="32" y="144" class="draft">the landing page learns this first</text>
    </g>

    <g opacity="0.45">
      <animate attributeName="opacity" values="0.45;1;1;0.45" keyTimes="0;0.18;0.82;1" begin="1.05s" dur="4.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 10" keyTimes="0;0.18;0.82;1" begin="1.05s" dur="4.8s" repeatCount="indefinite"/>
      <rect class="soft" x="20" y="160" width="278" height="30" rx="8"/>
      <text x="32" y="180" class="draft">the moat is doing unpaid overtime</text>
    </g>
  </g>

  <rect x="56" y="326" width="42" height="14" rx="7" fill="#43c47a" opacity="0.8">
    <animate attributeName="width" values="42;186;42" keyTimes="0;0.62;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect class="accent" x="108" y="326" width="10" height="14" rx="2">
    <animate attributeName="x" values="108;252;108" keyTimes="0;0.62;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite"/>
  </rect>
</svg>
